name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Dummy values only: nothing here reaches a real Supabase project.
      APP_ENV: development
      HOST: 127.0.0.1
      PORT: '9000'
      WEB_ORIGIN: http://localhost:4000
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      # ffmpeg-static downloads its binary from GitHub Releases during postinstall, which
      # intermittently answers 504. Cache the download and retry the install a few times.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ffmpeg-static-${{ runner.os }}-
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      # Build first: API e2e specs import compiled output from dist/, so typecheck needs it.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Generated contracts are up to date
        run: |
          pnpm openapi
          git diff --exit-code -- packages/contracts

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t rental-api:ci .
      - name: Build web image
        run: |
          docker build --target web -t rental-web:ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com .
